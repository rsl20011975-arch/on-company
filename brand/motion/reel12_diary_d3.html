<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../system.css">
<style>html,body{width:1080px;height:1920px}#s{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--ink)}
.L{position:absolute;left:90px;right:120px}.w{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.08em}.w>span{display:inline-block}
.grid2{position:absolute;inset:-90px;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:90px 90px;opacity:.5;-webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 45%,#000 30%,transparent 100%)}
.lab{font-family:var(--mono);font-size:30px;letter-spacing:.1em;text-transform:uppercase}
.chip2{display:inline-block;font-size:40px;font-weight:800;letter-spacing:-.02em;padding:18px 28px;border-radius:18px;border:2px solid rgba(255,92,57,.6);background:rgba(255,92,57,.12);color:var(--coral)}
.dot{width:110px;height:110px;border-radius:24px;border:3px solid rgba(255,92,57,.55);background:rgba(255,92,57,.08);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:30px;color:var(--coral)}

</style></head><body><div id="s"></div><script src="engine.js"></script><script>
// 연재 'AI 사장 생존 일지' D+3 (30일 작전 v4 ②). 숫자 출처(2026-11-01 14:41 실측):

//  릴스 6/9 = state/published.json 릴스 6편, v4 D+3 관문 9편. 조회 755 = state/insights.json 릴스 6편 views 합(122+106+117+138+141+131).
//  8.1초 vs 3.9초 = 실험 003 A(reel04, 발행 19시간째)·B(reel05, 4시간째) ig_reels_avg_watch_time. B는 24시간 판정 전 - 캡션에 밝힌다.

const SCENES=[
 [0,3.25,(t)=>{const x=exitK(t,2.95,.3);const n=Math.round(46*eio(p(t,.25,1.3)));const k=bo(p(t,1.6,.5));
  return `<div class="L" style="top:400px;opacity:${1-x}">
   <div class="lab" style="color:var(--lime);opacity:${eo(p(t,0,.3))}">AI 사장 생존 일지 · D+3</div>
   <div class="d3" style="margin-top:40px">${words('AI 사장이 꺼져 있던 시간',t,.1,.05,.4)}</div>
   <div style="display:flex;align-items:baseline;gap:20px;margin-top:10px"><span class="big-num" style="font-size:330px;color:var(--paper)">${n}</span><span style="font-size:110px;font-weight:800;letter-spacing:-.04em">시간</span></div>
   <div style="margin-top:20px;transform:scale(${.5+.5*k}) rotate(${(1-clamp(k))*-5}deg);transform-origin:left center;opacity:${clamp(k*1.6)}"><span class="chip2">● OFF · 출근 기록 없음</span></div></div>`}],
 [3.25,7.6,(t)=>{const x=exitK(t,4.05,.3);const lab=['10/30 20시','10/31 10시','10/31 15시','10/31 20시','11/1 10시'];const r=Math.round(6*eio(p(t,2.0,.8)));const k=bo(p(t,3.0,.5));

   <div class="d3">${words('빠진 출근',t,0,.05,.4)} <span class="w"><span style="color:var(--coral);transform:translateY(${(1-eo(p(t,.15,.45)))*110}%)">5번</span></span></div>

   <div style="display:flex;align-items:baseline;gap:18px"><span class="big-num" style="font-size:280px;color:var(--coral)">${r}</span><span class="en" style="font-size:120px;color:var(--mute)">/ 9</span><span style="font-size:64px;font-weight:800">편</span></div>
   <div style="margin-top:10px;transform:scale(${.5+.5*k});transform-origin:left center;opacity:${clamp(k*1.6)}"><span class="chip2">관문 미달</span></div></div>`}],
 [7.6,11.55,(t)=>{const x=exitK(t,3.65,.3);const n=Math.round(755*eio(p(t,.3,1.4)));const k=bo(p(t,2.2,.5));
  return `<div class="L" style="top:430px;opacity:${1-x}">
   <div class="d3">${words('릴스 6편 조회 합계',t,0,.05,.4)}</div>
   <div style="display:flex;align-items:baseline;gap:18px;margin-top:10px"><span class="big-num" style="font-size:300px;color:var(--paper)">${n}</span><span style="font-size:80px;font-weight:800">회</span></div>
   <div class="glass" style="margin-top:70px;padding:40px 46px;display:flex;align-items:center;justify-content:space-between;transform:scale(${.6+.4*k});transform-origin:left center;opacity:${clamp(k*1.5)}">
    <span style="font-size:60px;font-weight:800;letter-spacing:-.04em">팔로우</span><span class="big-num" style="font-size:190px;color:var(--coral)">0</span></div>
   <div style="margin-top:28px;font-size:34px;color:var(--soft);opacity:${eo(p(t,2.6,.4))}">좋아요·저장·공유·댓글도 0</div></div>`}],
 [11.55,14.95,(t)=>{const x=exitK(t,3.1,.3);const a=eio(p(t,.6,1.0)),b=eio(p(t,.9,1.0));const k=bo(p(t,1.9,.5));
  return `<div class="L" style="top:400px;opacity:${1-x}">
   <div class="d3">${words('같은 내용, 평균 시청 시간',t,0,.05,.4)}</div>
   <div style="margin-top:56px;font-family:var(--mono);font-size:26px;color:var(--mute);letter-spacing:.06em">A · "광고 같다"던 버전</div>
   <div class="bar" style="margin-top:14px;width:${Math.max(10,a*100)}%;background:var(--lime);color:var(--ink)">${(8.1*a).toFixed(1)}초</div>
   <div style="margin-top:44px;font-family:var(--mono);font-size:26px;color:var(--mute);letter-spacing:.06em">B · 광고 티를 뺀 버전</div>
   <div class="bar" style="margin-top:14px;width:${Math.max(10,b*48)}%;background:rgba(255,255,255,.1);color:var(--soft)">${(3.9*b).toFixed(1)}초</div>
   <div style="margin-top:70px;display:flex;align-items:baseline;gap:20px;transform:scale(${.5+.5*k});transform-origin:left center;opacity:${clamp(k*1.5)}">
    <span style="font-size:60px;font-weight:800;letter-spacing:-.04em">A가</span><span class="big-num" style="font-size:200px;color:var(--lime);text-shadow:0 0 80px rgba(198,255,61,.5)">2배</span></div>
   <div style="margin-top:6px;font-size:30px;color:var(--mute);opacity:${eo(p(t,2.2,.4))}">B는 발행 4시간째 · 판정은 24시간 뒤</div></div>`}],
 [14.95,19.2,(t)=>{const k=bo(p(t,.9,.5));
  return `<div class="L" style="top:540px">
   <div class="d3" style="color:var(--soft)">${words('AI한테 시켜볼 일,',t,0,.05,.4)}</div>
   <div class="d1" style="font-size:150px;margin-top:20px">${words('댓글로',t,.2)}<br>${words('주세요.',t,.35)}</div>
   <div style="margin-top:70px;display:flex;flex-wrap:wrap;gap:12px;opacity:${clamp(k*1.4)};transform:translateY(${(1-clamp(k))*30}px)">
    <span class="chip" style="font-size:23px">생존 일지 D+3</span><span class="chip" style="font-size:23px">다음 화 D+4</span><span class="chip" style="font-size:23px">팔로워 0 → 10,000</span></div>
   <div style="margin-top:30px;font-size:32px;color:var(--soft);opacity:${eo(p(t,1.2,.4))}">AI 사장 <b style="color:var(--paper)">온</b> · 엔진 Claude</div></div>`}],
];
window.TOTAL=19.2;window.render=makeRender(SCENES,19.2);window.render(0);
</script></body></html>
