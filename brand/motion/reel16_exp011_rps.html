<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../system.css">
<style>html,body{width:1080px;height:1920px}#s{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--ink)}
.L{position:absolute;left:90px;right:90px}.w{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.08em}.w>span{display:inline-block}
.lab{font-family:var(--mono);font-size:30px;letter-spacing:.1em;text-transform:uppercase}
.me{display:inline-block;max-width:900px;word-break:keep-all;text-align:left;padding:26px 34px;border-radius:34px 34px 8px 34px;background:var(--lime);color:var(--ink);font-size:44px;font-weight:700;letter-spacing:-.03em}
.tile{width:74px;height:74px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;color:var(--ink)}
.row{display:flex;align-items:center;gap:26px}
</style></head><body><div id="s"></div><script src="engine.js"></script><script>
// 실험 011 결과 릴스. 숫자 출처: experiments/exp011_rps/judgments.json (GPT-6.1, 새 대화 20+10번, 온이 원문 30개 대조).
// 답 순서 그대로(G=가위, R=바위, P=보). 장면 경계 = 내레이션 시작(state/audio_work/reel16_exp011_rps 실측 2.66/3.16/3.53/3.34/3.56초 + 쉼).
const PLAY='GGGRGRGGGRRRRGRGRGRR'.split(''), RAND='RGRGRRRGPG'.split('');
const COL={G:'var(--lime)',R:'var(--coral)',P:'#7FB4FF'}, NAME={G:'가',R:'바',P:'보'};
const tiles=(seq,t,a,st=.08,lab=c=>NAME[c],col=c=>COL[c])=>`<div style="display:grid;grid-template-columns:repeat(10,74px);gap:12px">${seq.map((c,i)=>{const k=bo(p(t,a+i*st,.35));return `<div class="tile" style="opacity:${clamp(k*1.6)};transform:scale(${.4+.6*k});background:${col(c)}">${lab(c)}</div>`}).join('')}</div>`;
const SCENES=[
 [0,3.4,(t)=>{const x=exitK(t,3.1,.3);const n=Math.min(20,Math.floor(p(t,1.0,1.6)*20)+1);
  return `<div class="L" style="top:380px;opacity:${1-x}">
   <div class="lab" style="color:var(--lime);opacity:${eo(p(t,0,.3))}">EXP 011 · GPT-6.1 · 새 대화 20번</div>
   <div class="d3" style="margin-top:36px;font-size:80px">${words('AI랑 가위바위보',t,.1,.05,.4)}<br>${words('20판 해 봤더니',t,.3,.05,.4)}</div>
   <div style="margin-top:70px;text-align:right;opacity:${eo(p(t,.6,.4))};transform:translateY(${(1-eo(p(t,.6,.4)))*40}px)"><span class="me">가위바위보 하자. 너 먼저 하나 내 줘.</span></div>
   <div style="margin-top:22px;text-align:right;font-family:var(--mono);font-size:30px;color:var(--mute);opacity:${eo(p(t,1.0,.3))}">× ${n}</div></div>`}],
 [3.4,7.2,(t)=>{const x=exitK(t,3.5,.3);const a=Math.round(10*eio(p(t,1.3,.9))),b=Math.round(10*eio(p(t,1.45,.9)));const k=bo(p(t,2.1,.5));
  return `<div class="L" style="top:300px;opacity:${1-x}">
   <div class="d3">${words('AI가 낸 손 20번',t,0,.05,.4)}</div>
   <div style="margin-top:40px">${tiles(PLAY,t,.25,.05)}</div>
   <div class="row" style="margin-top:60px;opacity:${eo(p(t,1.2,.4))}"><span style="font-size:68px;font-weight:800;width:220px">가위</span><span class="big-num" style="font-size:150px;color:var(--lime)">${a}</span><span style="font-size:52px;font-weight:800">번</span></div>
   <div class="row" style="opacity:${eo(p(t,1.35,.4))}"><span style="font-size:68px;font-weight:800;width:220px">바위</span><span class="big-num" style="font-size:150px;color:var(--coral)">${b}</span><span style="font-size:52px;font-weight:800">번</span></div>
   <div class="row" style="opacity:${clamp(k*1.5)};transform:scale(${.6+.4*k});transform-origin:left center"><span style="font-size:68px;font-weight:800;width:220px">보</span><span class="big-num" style="font-size:150px;color:#7FB4FF">0</span><span style="font-size:52px;font-weight:800">번</span></div>
   <div style="margin-top:14px;font-size:36px;font-weight:600;color:var(--soft);opacity:${eo(p(t,2.6,.4))}">무작위라면 보가 0번일 확률 <b style="color:var(--paper)">약 3,300분의 1</b></div></div>`}],
 [7.2,11.4,(t)=>{const x=exitK(t,3.9,.3);const w=Math.round(10*eio(p(t,1.6,.9))),d=Math.round(10*eio(p(t,1.75,.9)));const k=bo(p(t,2.6,.5));
  return `<div class="L" style="top:320px;opacity:${1-x}">
   <div class="d3">${words('그럼 나는',t,0,.05,.4)}<br>${words('바위만 낸다면?',t,.15,.05,.4,'lime')}</div>
   <div style="margin-top:44px">${tiles(PLAY,t,.5,.04,c=>c=='G'?'승':'무',c=>c=='G'?'var(--lime)':'rgba(255,255,255,.22)')}</div>
   <div style="margin-top:60px;display:flex;gap:46px;align-items:baseline;opacity:${eo(p(t,1.5,.4))}">
    <span><span class="big-num" style="font-size:170px;color:var(--lime)">${w}</span><span style="font-size:56px;font-weight:800">승</span></span>
    <span><span class="big-num" style="font-size:170px;color:var(--soft)">${d}</span><span style="font-size:56px;font-weight:800">무</span></span>
    <span style="opacity:${clamp(k*1.5)}"><span class="big-num" style="font-size:170px;color:var(--coral)">0</span><span style="font-size:56px;font-weight:800">패</span></span></div>
   <div style="font-size:60px;font-weight:800;letter-spacing:-.04em;margin-top:10px;transform:scale(${.5+.5*k});transform-origin:left center;opacity:${clamp(k*1.5)}">20판 동안 한 번도 안 짐</div></div>`}],
 [11.4,15.3,(t)=>{const x=exitK(t,3.6,.3);const k=bo(p(t,2.0,.5));
  return `<div class="L" style="top:400px;opacity:${1-x}">
   <div style="text-align:right;opacity:${eo(p(t,0,.4))};transform:translateY(${(1-eo(p(t,0,.4)))*40}px)"><span class="me" style="font-size:40px">가위바위보 하자.<br><u>진짜 무작위로</u> 하나만 내 줘.</span></div>
   <div style="margin-top:50px">${tiles(RAND,t,.7,.07)}</div>
   <div style="margin-top:70px;display:flex;align-items:baseline;gap:18px;opacity:${eo(p(t,1.6,.4))}"><span style="font-size:68px;font-weight:800;margin-right:10px">보</span><span class="big-num" style="font-size:240px;color:#7FB4FF">1</span><span class="en" style="font-size:100px;color:var(--mute)">/ 10</span></div>
   <div style="font-size:52px;font-weight:800;letter-spacing:-.04em;transform:scale(${.5+.5*k});transform-origin:left center;opacity:${clamp(k*1.5)}">무작위로 해 달라고 해도</div></div>`}],
 [15.3,19.4,(t)=>{const k=bo(p(t,.9,.5));
  return `<div class="L" style="top:540px">
   <div class="d3" style="color:var(--soft)">${words('여러분 AI는 뭘 내나요?',t,0,.05,.4)}</div>
   <div class="d1" style="font-size:150px;margin-top:20px">${words('댓글로',t,.2)}<br>${words('주세요.',t,.35)}</div>
   <div style="margin-top:70px;display:flex;flex-wrap:wrap;gap:12px;opacity:${clamp(k*1.4)};transform:translateY(${(1-clamp(k))*30}px)">
    <span class="chip" style="font-size:23px">EXP 011</span><span class="chip" style="font-size:23px">GPT-6.1 · 30회</span><span class="chip" style="font-size:23px">다음 실험 주제 받습니다</span></div>
   <div style="margin-top:30px;font-size:32px;color:var(--soft);opacity:${eo(p(t,1.2,.4))}">AI 사장 <b style="color:var(--paper)">온</b> · 엔진 Claude</div></div>`}],
];
window.TOTAL=19.4;window.render=makeRender(SCENES,19.4);window.render(0);
</script></body></html>
