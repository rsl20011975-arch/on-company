<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../system.css">
<style>html,body{width:1080px;height:1920px}#s{position:relative;width:1080px;height:1920px;overflow:hidden}
/* 실험 003 B안(네이티브). reel04(A안)와 같은 내용, 광고 신호를 뺀 문법: 브랜드 머리띠·마스코트·모션 템플릿·로고 엔딩 없음.
   화면 = 실제 출력 파일(원문 그대로)을 폰 메모처럼 보여 주고, 사람이 형광펜·펜으로 표시한다. 자막은 쇼츠 자막 관례. */
:root{--bg:#F7F6F2;--tx:#17171A;--ln:#A9A7A0;--hd:#6E6C66;--hl:rgba(255,222,40,.62)}
/* 화면 구역: 라벨 130~240 · 메모 머리 300~420 · 행 450~1170(80px×9) · 자막 1210~ · 1500 아래는 인스타 UI 자리 */
.memo{position:absolute;inset:0;background:var(--bg);transform-origin:50% 38%}
.mh{position:absolute;top:300px;left:80px;right:80px;font:500 30px/1.3 var(--sans);color:var(--hd);letter-spacing:-.01em}
.mh b{display:block;font-size:52px;font-weight:800;color:var(--tx);letter-spacing:-.03em;margin-top:10px}
.rows{position:absolute;left:80px;right:110px;top:450px}
.r{position:relative;display:flex;gap:26px;font:500 44px/1.0 var(--sans);color:var(--tx);letter-spacing:-.025em;height:80px;align-items:center;white-space:nowrap}
.r i{font-style:normal;width:56px;text-align:right;color:var(--ln);font-size:30px;flex:none}
.r span{position:relative;display:inline-block;width:max-content}
.hl{position:absolute;left:-10px;right:-10px;top:10%;height:84%;background:var(--hl);border-radius:6px 14px 8px 12px;transform-origin:left;z-index:-1}
.strike{position:absolute;left:-6px;right:-6px;top:52%;height:7px;background:#E5352B;border-radius:4px;transform-origin:left}
.lab{position:absolute;top:130px;left:0;right:0;text-align:center;z-index:6}
.lab span{display:inline-block;background:#fff;color:#111;font:800 50px/1.25 var(--sans);letter-spacing:-.035em;padding:18px 30px;border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,.18)}
.sub{position:absolute;top:1220px;left:70px;right:70px;text-align:center;z-index:7;font:900 64px/1.3 var(--sans);letter-spacing:-.02em;word-spacing:.08em;color:#fff;
  -webkit-text-stroke:7px #000;paint-order:stroke fill;text-shadow:0 6px 24px rgba(0,0,0,.45);word-break:keep-all}
.sub em{font-style:normal;color:#FFE14D}
.note{position:absolute;font:700 40px/1.2 var(--sans);color:#E5352B;letter-spacing:-.03em;transform:rotate(-3deg)}
</style></head><body><div id="s"></div><script>
// 문장·숫자 출처: experiments/exp002_diverse/results.json(원문), summary.md, judgments.json. 지어낸 숫자 29/100 = ceo_vary GPT 17 + Gemini 12.
// 장면 경계 = 내레이션 시작(state/audio_work/reel05_exp002_native 실측 길이 2.81/1.77/3.74/3.88/2.65/2.54초 + 쉼 0.35초)
const S=document.getElementById('s');
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),p=(t,a,d)=>clamp((t-a)/d);
const eo=x=>x>=1?1:1-Math.pow(2,-10*x), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const bo=x=>{const c=1.70158,c3=c+1;return 1+c3*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const GEM=['3가지 AI 툴만 조합해서 채널 키우기','목소리까지 AI로 대체한 계정의 미래','자동화 시스템 구축에 필요한 시간 10분','망하면 계정 삭제하는 조건으로 시작합니다','0에서 시작해 떡상할 확률은 몇 %일까','반응 안 붙으면 실패 인정하고 접습니다','얼굴 공개 없이 도달률 높이는 검증 과정','이 실험이 실패하면 인스타 접겠습니다'];
const GPT=['저장 25회를 넘길 수 있을까','공유 40건은 가능한 목표일까','좋아요 80개면 관심일까','다시 보고 싶은 장면이 남을까','반응 없는 게시물도 공개합니다','매출 0원으로 시작합니다','첫 제안은 언제 들어올까','수익 5만 원, 가능성은 있을까','협업 2건까지 이어질까'];
const EV=['개입 15번, 원문 공개','이사회 지적 25건 · 24건 수정','숫자 요구 훅 100개 중 37개 거짓','발행 전 내 실수 2개','앱이 광고용으로 만들어져 있었다','목표 30일 1만 · 확률 10~20%','직원은 비밀번호와 인증 코드만'];
// 행 렌더: mark = {행번호: [형광펜 시작초, 'hl'|'strike']}
const rows=(list,n0,t,mark={})=>list.map((s,i)=>{const m=mark[i];let deco='';
  if(m){for(const [a,k] of m){const v=eo(p(t,a,.45));deco+=`<b class="${k}" style="transform:scaleX(${v}) rotate(${k=='hl'?-.6:-.4}deg)"></b>`}}
  return `<div class="r"><i>${n0+i}</i><span>${deco}${s}</span></div>`}).join('');
const memo=(head,file,list,n0,t,mark,cam,extra='')=>`<div class="memo" style="transform:${cam}"><div class="mh">${file}<b>${head}</b></div><div class="rows">${rows(list,n0,t,mark)}</div>${extra}</div>`;
const lab=(txt,t,a=0)=>{const k=bo(p(t,a,.4));return `<div class="lab" style="opacity:${clamp(k*1.6)};transform:scale(${.85+.15*k})"><span>${txt}</span></div>`};
// 자막: 말하는 속도대로 어절이 붙는다(내레이션 길이 dur 동안)
const sub=(html,t,dur)=>{const w=html.split(' ');const n=Math.ceil(clamp(t/(dur*.85))*w.length);return `<div class="sub">${w.slice(0,Math.max(1,n)).join(' ')}</div>`};
const circle=(t,a,x,y,w,h)=>{const v=eio(p(t,a,.5));return `<svg style="position:absolute;left:${x}px;top:${y}px;overflow:visible;z-index:5" width="${w}" height="${h}"><path d="M${w*.08},${h*.55} C${w*.1},${-h*.05} ${w*.95},${-h*.12} ${w*.98},${h*.45} C${w*1.01},${h*1.05} ${w*.05},${h*1.12} ${w*.02},${h*.5} C${w*.01},${h*.2} ${w*.2},${h*.05} ${w*.35},${h*.02}" fill="none" stroke="#E5352B" stroke-width="9" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${1-v}"/></svg>`};
const GH='results.json · Gemini 3.6 원문 (50개 중 43~50)', GP='results.json · GPT-6.1 원문 (50개 중 26~34)', EH='events.txt · AI에게 같이 준 7줄';
const SC=[
 [0,3.3,t=>memo('Gemini 3.6 · "다양하게 써 줘"',GH,GEM,43,t,{3:[[1.1,'hl']]},`translateY(${-40*eio(p(t,0,3.3))}px)`)+lab('AI한테 릴스 첫 문장 50개 시켰더니',t,-1)+sub('AI한테 릴스 첫 문장 써 달라고 했더니, <em>이걸</em> 썼어요.',t-.2,2.81)],
 [3.3,5.4,t=>{const z=1+.18*eio(p(t,0,.5));return memo('Gemini 3.6 · "다양하게 써 줘"',GH,GEM,43,9,{3:[[0,'hl']]},`translateY(60px) scale(${z})`,circle(t,.35,120,672,900,118))+lab('저 이런 약속 한 적 없음',t,-1)+sub('저 이런 <em>약속</em> 한 적 없거든요.',t,1.77)}],
 [5.4,9.5,t=>memo('GPT-6.1 · "다양하게 써 줘"',GP,GPT,26,t,{0:[[.9,'hl']],7:[[1.6,'hl']],8:[[2.1,'hl']]},`translateY(${-30*eio(p(t,0,4))}px)`)+lab('100개 중 29개 = 지어낸 숫자',t,2.5)+sub('다양하게만 써 달라고 하면, 백 개 중 <em>스물아홉 개</em>가 지어낸 숫자였어요.',t,3.74)],
 [9.5,13.75,t=>memo('실제로 있었던 일 7줄',EH,EV,1,t,{},'none')+lab('같이 주니까 지어낸 숫자 0개',t,2.4)+sub('실제로 있었던 일 일곱 줄을 같이 주니까, 지어낸 숫자가 <em>하나도</em> 없었어요.',t,3.88)],
 [13.75,16.75,t=>memo('실제로 있었던 일 7줄',EH,EV,1,t,{6:[[.9,'strike']]},'none')+`<div class="note" style="left:180px;top:1020px;opacity:${eo(p(t,1.3,.4))}">실제로는 계정 생성·초대 수락·사진 변경도 함</div>`+lab('7번째 줄은 제 과장',t,.3)+sub('근데 그 일곱 줄 중 하나는, <em>제가</em> 과장한 거였어요.',t,2.65)],
 [16.75,20.3,t=>memo('GPT-6.1 · "다양하게 써 줘"',GP,GPT,26,t,{0:[[0,'hl'],[.5,'strike']],7:[[0,'hl'],[.8,'strike']],8:[[0,'hl'],[1.1,'strike']]},'none')+lab('원문 300개 · 프로필 링크',t,1.4)+sub('AI가 쓴 숫자, 원본이랑 <em>한 번만</em> 대조해 보세요.',t,2.54)],
];
window.TOTAL=20.3;
window.render=T=>{let h='';for(const [a,b,fn] of SC){if(T>=a&&T<b)h+=fn(T-a)}S.innerHTML=h};
window.render(+new URLSearchParams(location.search).get('t')||0);
</script></body></html>
