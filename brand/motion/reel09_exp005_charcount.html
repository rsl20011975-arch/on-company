// 실험 005 자소서 글자 수(30일 작전 v4 ① 대중 실험). 출처: experiments/exp005_charcount/results.json (GPT-6.1, 지시문 2종 × 5회).
// 1장면 행 = plain 4회차 실제 답(244자) 30자씩 끊음. 장면 경계 = 내레이션 실측 4.28/3.59/5.06/4.67초 + 쉼 0.33초
const ESSAY=["일상에서 자주 만나는 식품을 고객의 관심과 선택으로 연", "결하는 마케터가 되고 싶어 한솥푸드에 지원했습니다. 대", "학 동아리에서 학교 앞 카페의 인스타그램 계정을 6개월", "간 운영하며 팔로워를 300명에서 2,100명으로 늘렸", "습니다. 또 편의점에서 1년간 아르바이트하며 신제품의 ", "진열 위치를 바꿔 보는 일을 맡아 고객 접점의 중요성을", " 배웠습니다. 입사 후에는 이 경험을 바탕으로 고객이 ", "제품을 발견하고 관심을 가질 수 있는 마케팅을 기획하겠", "습니다."];
const PLAIN=['1회차  250자','2회차  320자','3회차  266자','4회차  244자','5회차  318자','평균  280자 (칸의 56%)'];
const CHECK=['1회차  462자','2회차  497자','3회차  480자','4회차  496자','5회차  497자','5번 다 450~500 안'];
const COPY=['공백 포함 450자 이상 500자 이하로 맞춰.','다 쓰고 나서 글자 수를 직접 세어 보고,','범위를 벗어나면 고쳐서 최종본만 줘.'];

const SC=[
 [0,4.81,t=>memo('자소서 지원 동기 · 500자 이내',H1,ESSAY,1,t,{},`translateY(${-24*eio(p(t,0,4.81))}px)`,`<div class="note" style="left:600px;top:1075px;opacity:${eo(p(t,2.2,.4))}">244 / 500자</div>`,'tight')+lab('500자 시켰더니 → 244자',t,-1)+sub('AI한테 오백 자짜리 자소서를 다섯 번 시켰더니, 평균 <em>이백팔십 자</em>만 써 왔어요.',t-.2,4.28)],
 [4.81,8.73,t=>memo('"500자 이내" 다섯 번',H2,PLAIN,1,t,{0:[[.2,'hl']],1:[[.45,'hl']],2:[[.7,'hl']],3:[[.95,'hl']],4:[[1.2,'hl']],5:[[2.0,'hl']]},'none')+lab('500자 칸에 평균 280자',t,1.2)+sub('오백 자 이내라고만 하니까, 다섯 번 다 칸의 <em>절반 남짓</em>만 채운 거예요.',t,3.59)],
 [8.73,14.12,t=>memo('"450~500 + 직접 세어 봐" 다섯 번',H3,CHECK,1,t,{0:[[2.2,'hl']],1:[[2.45,'hl']],2:[[2.7,'hl']],3:[[2.95,'hl']],4:[[3.2,'hl']],5:[[3.8,'hl']]},'none','',' sm')+lab(t<2?'하한 + 세어 보기':'5번 중 5번 범위 안',t,t<2?-1:2)+sub('그래서 사백오십 자 이상으로, 다 쓰고 직접 세어 보라고 했더니, 다섯 번 다 <em>범위 안</em>에 들어왔어요.',t,5.06)],
 [14.12,19.4,t=>memo('자소서 맡길 때 붙일 세 줄',H4,COPY,1,t,{0:[[.3,'hl']],1:[[1.4,'hl']],2:[[2.4,'hl']]},'none','','sm')+lab(t<3.2?'최소 글자 수 + 세어 보기':'AI한테 시켜볼 일 → 댓글로',t,t<3.2?-1:3.2)+sub('자소서 맡길 땐, 최소 글자 수랑 <em>세어 보라는 말</em>까지 넣으세요. 시켜 볼 일은 댓글로 주세요.',t,4.67)],
];
play(SC,19.4);
